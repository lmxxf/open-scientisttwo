[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "open-scientisttwo"
version = "0.1.0"
requires-python = ">=3.10"
description = "Auditable six-stage CLI research demonstration"
[project.optional-dependencies]
toy = ["numpy>=1.24"]
[project.scripts]
open-scientisttwo = "open_scientisttwo.pipeline:main"
[tool.setuptools.packages.find]
include = ["open_scientisttwo*"]
[tool.setuptools.package-data]
open_scientisttwo = ["AGENTS.md"]
